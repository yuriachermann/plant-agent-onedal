name: ci

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -r requirements.txt pytest ruff threadpoolctl
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q
      - name: Parity (size S, outside the repo)
        run: python -m bench.parity --size S --out "$RUNNER_TEMP"

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements.txt pytest ruff threadpoolctl
      - name: Test
        run: pytest -q
